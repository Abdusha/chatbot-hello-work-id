<body>
    <!-- Widget Root & File Input -->
    <div id="widget-root"></div>
    <input type="file" id="file-input" accept="application/pdf" style="display: none;" />

    <script>
        // Redirect to add expanded=true parameter if not present
        const params = new URLSearchParams(window.location.search);
        if (!params.has('expanded')) {
            window.location.href = window.location.href + (window.location.href.includes('?') ? '&' : '?') + 'expanded=true';
        }
    </script>
    <script type="module" src="widget.js" defer></script>
</body>
